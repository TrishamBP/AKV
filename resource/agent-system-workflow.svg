<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" role="img" aria-labelledby="title description">
  <title id="title">AKV agent and system workflow</title>
  <desc id="description">The Agent contains the Harness and AKV Agent. Inside the Harness, optional cache tools are registered before building a request. The request flows to AKV Agent to prepare cache operations, then to AKV System for inference, Drop and Reposition. The response returns to the Harness operation that handles responses and executes tools, then flows back to building the next request. Arrows connect operation boxes; the larger frames show component boundaries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="960" height="416" rx="12" fill="#ffffff"/>
  <g stroke-width="1.5">
    <rect x="16" y="16" width="588" height="384" rx="12" fill="#f4f7fb" stroke="#cbd5e1"/>
    <rect x="630" y="16" width="314" height="384" rx="12" fill="#f3f8f5" stroke="#cbd5e1"/>

    <rect x="36" y="72" width="274" height="304" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="330" y="160" width="256" height="132" rx="10" fill="#e8f1ff" stroke="#739bd0"/>
    <rect x="648" y="160" width="278" height="132" rx="10" fill="#e9f6ed" stroke="#78a78b"/>

    <rect x="58" y="120" width="230" height="48" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <rect x="58" y="208" width="230" height="56" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <rect x="58" y="304" width="230" height="56" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <rect x="350" y="208" width="216" height="56" rx="6" fill="#ffffff" stroke="#739bd0"/>
    <rect x="676" y="208" width="222" height="56" rx="6" fill="#ffffff" stroke="#78a78b"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
    <g font-size="19" font-weight="700">
      <text x="36" y="49">Agent</text>
      <text x="650" y="49">System</text>
    </g>
    <g text-anchor="middle">
      <text x="173" y="103" font-size="17" font-weight="700">Harness</text>
      <text x="458" y="189" font-size="17" font-weight="700">AKV Agent</text>
      <text x="787" y="189" font-size="17" font-weight="700">AKV System</text>

      <text x="173" y="140" font-size="14" font-weight="700">Optional cache tools</text>
      <text x="173" y="157" font-size="12" fill="#475569">Schema + execute handler</text>
      <text x="173" y="241" font-size="15">Build request</text>
      <text x="173" y="327" font-size="14">Handle response</text>
      <text x="173" y="347" font-size="14">and execute tools</text>
      <text x="458" y="241" font-size="14">Prepare cache operations</text>
      <text x="787" y="231" font-size="14">Model inference</text>
      <text x="787" y="251" font-size="13">Drop and Reposition</text>
    </g>
  </g>

  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 173 168 V 208" stroke-dasharray="5 4"/>
    <path d="M 288 236 H 350"/>
    <path d="M 566 236 H 676"/>
    <path d="M 787 264 V 324 Q 787 332 779 332 H 288"/>
    <path d="M 173 304 V 264"/>
  </g>
</svg>
