<svg xmlns="http://www.w3.org/2000/svg" width="960" height="328" viewBox="0 0 960 328" role="img" aria-labelledby="title description">
  <title id="title">AKV agent and system workflow</title>
  <desc id="description">The Agent contains the Harness and AKV Agent. The Harness builds a request, which flows to AKV Agent to prepare cache operations, then to AKV System for inference, Drop and Reposition. The response returns to the Harness operation that handles responses and executes tools, then flows back to building the next request. Arrows connect operation boxes; the larger frames show component boundaries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="960" height="328" rx="12" fill="#ffffff"/>
  <g stroke-width="1.5">
    <rect x="16" y="16" width="588" height="296" rx="12" fill="#f4f7fb" stroke="#cbd5e1"/>
    <rect x="630" y="16" width="314" height="296" rx="12" fill="#f3f8f5" stroke="#cbd5e1"/>

    <rect x="36" y="72" width="274" height="216" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="330" y="72" width="256" height="132" rx="10" fill="#e8f1ff" stroke="#739bd0"/>
    <rect x="648" y="72" width="278" height="132" rx="10" fill="#e9f6ed" stroke="#78a78b"/>

    <rect x="58" y="120" width="230" height="56" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <rect x="58" y="216" width="230" height="56" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <rect x="350" y="120" width="216" height="56" rx="6" fill="#ffffff" stroke="#739bd0"/>
    <rect x="676" y="120" width="222" height="56" rx="6" fill="#ffffff" stroke="#78a78b"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
    <g font-size="19" font-weight="700">
      <text x="36" y="49">Agent</text>
      <text x="650" y="49">System</text>
    </g>
    <g text-anchor="middle">
      <text x="173" y="103" font-size="17" font-weight="700">Harness</text>
      <text x="458" y="103" font-size="17" font-weight="700">AKV Agent</text>
      <text x="787" y="103" font-size="17" font-weight="700">AKV System</text>

      <text x="173" y="153" font-size="15">Build request</text>
      <text x="173" y="239" font-size="14">Handle response</text>
      <text x="173" y="259" font-size="14">and execute tools</text>
      <text x="458" y="153" font-size="14">Prepare cache operations</text>
      <text x="787" y="143" font-size="14">Model inference</text>
      <text x="787" y="163" font-size="13">Drop and Reposition</text>
    </g>
  </g>

  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 288 148 H 350"/>
    <path d="M 566 148 H 676"/>
    <path d="M 787 176 V 236 Q 787 244 779 244 H 288"/>
    <path d="M 173 216 V 176"/>
  </g>
</svg>
