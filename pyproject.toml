[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akv"
version = "0.1.0"
description = "Agent policies and KV cache operations for SGLang"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["akv-agent[tokenization]==0.2.0", "akv-system==0.1.0"]

[tool.uv]
default-groups = []
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
akv-agent = { path = "akv/agent", editable = true }
akv-system = { path = "akv/system", editable = true }

[tool.setuptools]
packages = []
include-package-data = false
